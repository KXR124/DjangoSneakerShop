
{% extends 'base.html' %}
{%block content %}
<body style="background-color:powderblue;">
<h1><marquee bgcolor="#ff0d55"> 
Welcome to the Sneakaroo! 

</marquee></h1>
<h4>
<!--body-->
<div class="contairner-fluid mt-3">
    <div class= "row">
        <!--filter-->
        <div class="col-lg-3 mx-auto">
            <div class="list-group">
                {% for category in categories %}
                <a href="/?category={{category.id}}" class="list-group-item list-group-item-action">{{category.name}}</a>
                {% endfor %}
                
            </div>

        </div>

        <!--all products-->
        <div id='products' class= "col-lg-8 mx-auto">
            <div class="row mx-auto">
                {% for product in products %}
                <div class="card bg-info mx-auto mb-3" style="width: 18rem;">
                    <img class="card-img-top" src="{{product.image.url}}" alt="Card image cap">
            <div class="card-body">
                <b style="font-family:'Courier New'" class= "card-title">{{product.name}}</b><br>
            </br>
                <p style="font-family:'Courier New'" class="card-text">₹{{product.price}}</p>
                <a href="#" class="btn btn-light border btn-sm">Add to Cart</a>
            </div>
        </div>
        {% endfor %}
</div></h4>
{%endblock%}
